<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Simulator Production</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game-container">

    <!-- STARTER SCREEN -->
    <div id="starter-screen" class="screen">
      <h2>CHOOSE YOUR PARTNER</h2>
      <div id="starter-list" class="grid"></div>
    </div>


    <!-- MAP SCREEN -->
    <div id="map-screen" class="screen" style="display:none;">

      <h2 id="region-title">🌍 REGION: KANTO</h2>

      <h3>
        Owned:
        <span id="owned-count">1</span>
      </h3>

      <div
        id="region-select-list"
        class="grid"
        style="margin-bottom: 10px;"
      ></div>

      <button id="wild-btn" class="btn wild">
        🌿 Search Wild Grass
      </button>

      <button id="casual-3-btn" class="btn gym" style="margin-top:5px;">
        ⚔️ Casual Match (3v3)
      </button>

      <button id="casual-6-btn" class="btn gym" style="margin-top:5px;">
        ⚔️ Casual Match (6v6)
      </button>

      <hr>

      <div id="gym-list" class="grid-col"></div>

      <button id="elite-four-btn" class="btn locked" disabled>
        🏆 ELITE 4
      </button>

      <hr>

      <h2 style="color: #8e44ad;">
        ⚡ ANIME LEGENDS
      </h2>

      <div id="legend-list" class="grid-col"></div>

    </div>


    <!-- DRAFT SCREEN -->
    <div id="draft-screen" class="screen" style="display:none;">

      <h2>
        ASSEMBLE YOUR TEAM
        (<span id="draft-max">3</span>)
      </h2>

      <div id="roster-grid" class="grid"></div>

      <div
        id="move-selection-box"
        style="display:none; margin-top:15px;"
      >

        <h4>Select 4 Moves</h4>

        <div id="move-grid" class="grid"></div>

        <button id="confirm-moves-btn" class="btn confirm">
          Confirm Moves
        </button>

      </div>

    </div>


    <!-- BATTLE ARENA -->
    <div
      id="battle-screen"
      class="screen arena"
      style="display:none;"
    >

      <!-- ENEMY -->
      <div class="pokemon-container enemy">

        <div class="stats-box">

          <h3 id="enemy-name">
            Pokemon
          </h3>

          <p class="small-txt">
            Team Left:
            <span id="enemy-remaining">1</span>
          </p>

          <div class="health-bar-bg">
            <div
              id="enemy-health"
              class="health-bar-fill"
            ></div>
          </div>

        </div>

        <img
          id="enemy-sprite"
          src=""
          alt="Enemy Pokémon"
        >

      </div>


      <!-- PLAYER -->
      <div class="pokemon-container player">

        <img
          id="player-sprite"
          src=""
          alt="Player Pokémon"
        >

        <div class="stats-box">

          <h3 id="player-name">
            Pokemon
          </h3>

          <p class="small-txt">
            Team Left:
            <span id="player-remaining">1</span>
          </p>

          <div class="health-bar-bg">
            <div
              id="player-health"
              class="health-bar-fill"
            ></div>
          </div>

        </div>

      </div>


      <!-- BATTLE UI -->
      <div class="ui-panel">

        <div id="battle-log"></div>

        <div id="action-menu"></div>

      </div>

    </div>

  </div>


  <!-- GAME JAVASCRIPT -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
